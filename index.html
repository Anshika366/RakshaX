<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RakshaX</title>
    <meta name="description" content="RakshaX is a premium real-life safety application. One tap instantly alerts your family with your live GPS location, WhatsApp, SMS, and connects with nearby emergency services." />
    <meta property="og:title" content="RakshaX" />
    <meta property="og:description" content="RakshaX is a premium real-life safety application. One tap instantly alerts your family with your live GPS location, WhatsApp, SMS, and connects with nearby emergency services." />
    <!-- Leaflet CSS for offline map tile rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      // Early intercept and quiet benign HMR/WebSocket development server errors
      (function() {
        const pattern = /websocket|vite|hmr|failed to connect to websocket/i;

        // 1. Real secure WebSocket connection is fully enabled and proxied via server.ts upgrade event.

        // 2. Intercept errors and unhandled rejections during the capture phase
        window.addEventListener('error', function(e) {
          if (e.message && pattern.test(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : '';
          if (reason && pattern.test(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        // 3. Quiet console.error warnings for benign connection drops
        const origError = console.error;
        console.error = function(...args) {
          const text = args.map(arg => {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch {
              return String(arg);
            }
          }).join(' ');
          if (pattern.test(text)) {
            return;
          }
          origError.apply(console, args);
        };

        // 4. Force-remove any Vite Dev Error Overlays from polluting the UI
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName && node.tagName.toLowerCase() === 'vite-error-overlay') {
                try {
                  node.style.display = 'none';
                  node.remove();
                } catch (err) {}
              }
            });
          });
        });
        
        document.addEventListener('DOMContentLoaded', function() {
          observer.observe(document.body || document.documentElement, {
            childList: true,
            subtree: true
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
